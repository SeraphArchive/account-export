name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    if: startsWith(github.event.release.tag_name, 'account-export-v')
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Rust and LLVM
        shell: pwsh
        run: |
          rustup toolchain install --no-self-update --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
          Join-Path $env:ProgramFiles 'LLVM/bin' >> $env:GITHUB_PATH
      - name: Build, test and package
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $version -or $env:RELEASE_TAG -ne "account-export-v$version") {
            throw 'Release tag must match the Cargo.toml package version.'
          }
          ./build.ps1
      - name: Attach assets to published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG -replace '^account-export-v', ''
          $asset = "dist/hbr-account-export-v$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw 'Release ZIP was not built.' }
          gh release upload $env:RELEASE_TAG $asset --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
