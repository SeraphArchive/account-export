name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and LLVM
        shell: pwsh
        run: |
          rustup toolchain install --no-self-update --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
          Join-Path $env:ProgramFiles 'LLVM/bin' >> $env:GITHUB_PATH
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: account-export-win-x64
          path: dist/hbr-account-export-v*-win-x64.zip
          if-no-files-found: error
